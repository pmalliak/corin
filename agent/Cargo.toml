[package]
name = "corin-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
description = "Local LoL Coach Agent. Pairs with the Corin backend and reports League status over an outbound WebSocket."
license = "MIT"

[dependencies]
anyhow = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
gethostname = "0.5"
# Only the platform-native backends. The Linux secret-service backend needs an
# extra crypto feature and this agent targets Windows first.
keyring = { version = "3", features = ["windows-native", "apple-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only to build the match key that lets two friends in one game recognise each other.
sha2 = "0.10"
# Only the process list, to tell "League is closed" apart from "League is in a lobby".
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
# Autostart is a per-user Run key, which needs no administrator rights.
winreg = "0.52"
# The tray icon and its menu. muda comes with it and is what the menu is built from.
tray-icon = { version = "0.24", default-features = false }
# The console handling, and the small pairing window: one window class, an edit
# box and two buttons, which is less code than pulling in a GUI framework for it.
windows = { version = "0.57", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
# Puts the icons and the version block into the executable, so Explorer, the
# taskbar and the tray all have something to show.
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
